services:
  thelocal:
    build:
      context: .
      dockerfile: Dockerfile
    image: thelocal-nexus:demo
    container_name: thelocal-demo
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/data/dev.db
      DEMO_SEED: "${DEMO_SEED:-true}"
      # Demo geolocation default (shown when IP is private/unresolvable)
      DEV_GEO_ZIP: "${DEV_GEO_ZIP:-28301}"
      DEV_GEO_LAT: "${DEV_GEO_LAT:-35.0527}"
      DEV_GEO_LNG: "${DEV_GEO_LNG:--78.8784}"
      DEV_GEO_LABEL: "${DEV_GEO_LABEL:-Fayetteville, NC}"
      # Twilio optional — mock SMS when unset
      TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID:-}"
      TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN:-}"
      TWILIO_VERIFY_SERVICE_SID: "${TWILIO_VERIFY_SERVICE_SID:-}"
      # ALTCHA PoW — required in production (empty here fails OTP send at runtime)
      ALTCHA_HMAC_KEY: "${ALTCHA_HMAC_KEY:-}"
      ALTCHA_BYPASS_TEST_PHONES: "${ALTCHA_BYPASS_TEST_PHONES:-}"
    volumes:
      - thelocal-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

volumes:
  thelocal-data: