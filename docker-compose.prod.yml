# Production overlay for demo server (Thor). Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# DEMO_SEED defaults to false here so container rebuilds do NOT wipe the
# thelocal-data volume and first boot does NOT auto-seed (empty DB stays empty
# until real users; see docker/entrypoint.sh). Set DEMO_SEED=true only for an
# intentional demo reset.

services:
  thelocal:
    ports:
      - "3000:3000"
    environment:
      DEMO_SEED: "${DEMO_SEED:-false}"
      DEV_GEO_ZIP: "${DEV_GEO_ZIP:-28301}"
      DEV_GEO_LAT: "${DEV_GEO_LAT:-35.0527}"
      DEV_GEO_LNG: "${DEV_GEO_LNG:--78.8784}"
      DEV_GEO_LABEL: "${DEV_GEO_LABEL:-Fayetteville, NC}"
